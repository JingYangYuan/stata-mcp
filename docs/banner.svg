<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="stata-mcp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="48%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".42"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="progress-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="orb-right" cx="82%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#070c16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-left" cx="18%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#070c16" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-right)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-left)"/>
  <circle cx="1080" cy="70" r="140" fill="#38bdf8" opacity=".12" filter="url(#soft)"/>
  <circle cx="150" cy="380" r="110" fill="#2dd4bf" opacity=".14" filter="url(#soft)"/>

  <g stroke="#94a3b8" stroke-opacity=".06" stroke-width="1">
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420M640 0v420M720 0v420M800 0v420M880 0v420M960 0v420M1040 0v420M1120 0v420M1200 0v420"/>
    <path d="M0 70h1280M0 140h1280M0 210h1280M0 280h1280M0 350h1280"/>
  </g>

  <text x="88" y="88" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="4">LOCAL STATA MCP · ASYNC GATEWAY &amp; DESKTOP STUDIO</text>
  <text x="88" y="166" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="50" font-weight="800">stata<tspan fill="url(#title-grad)">-mcp</tspan></text>
  <text x="88" y="216" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">本地 AI Agent 驱动 Stata · 异步长任务 · 报错定位 · 破除循环</text>

  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">
    <rect x="88" y="248" width="72" height="36" rx="18" fill="#0c1e33" stroke="#38bdf8" stroke-opacity=".6"/>
    <circle cx="104" cy="266" r="4" fill="#38bdf8"/>
    <text x="114" y="271" fill="#bae6fd">jobs</text>

    <rect x="168" y="248" width="72" height="36" rx="18" fill="#082f36" stroke="#22d3ee" stroke-opacity=".6"/>
    <circle cx="184" cy="266" r="4" fill="#22d3ee"/>
    <text x="194" y="271" fill="#a5f3fc">help</text>

    <rect x="248" y="248" width="92" height="36" rx="18" fill="#1c0a10" stroke="#f43f5e" stroke-opacity=".6"/>
    <circle cx="264" cy="266" r="4" fill="#f43f5e"/>
    <text x="274" y="271" fill="#fecdd3">diagnose</text>

    <rect x="348" y="248" width="96" height="36" rx="18" fill="#1c1408" stroke="#f59e0b" stroke-opacity=".6"/>
    <circle cx="364" cy="266" r="4" fill="#f59e0b"/>
    <text x="374" y="271" fill="#fcd34d">anti-loop</text>

    <rect x="452" y="248" width="86" height="36" rx="18" fill="#111c30" stroke="#818cf8" stroke-opacity=".6"/>
    <circle cx="468" cy="266" r="4" fill="#818cf8"/>
    <text x="478" y="271" fill="#c4b5fd">inspect</text>

    <rect x="546" y="248" width="78" height="36" rx="18" fill="#061c18" stroke="#34d399" stroke-opacity=".6"/>
    <circle cx="562" cy="266" r="4" fill="#34d399"/>
    <text x="572" y="271" fill="#6ee7b7">studio</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="88" y="332" fill="#94a3b8" font-size="14" font-weight="500">查文档 → 反循环体检 → 异步执行 → 单步落盘 → 报错行号定位 → 数据探查</text>
    <rect x="88" y="348" width="536" height="12" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <rect x="88" y="348" width="536" height="12" rx="6" fill="url(#progress-bar)"/>
  </g>

  <g transform="translate(720 50)">
    <rect width="472" height="320" rx="20" fill="#0b1322" fill-opacity=".92" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="5.5" fill="#ef4444" opacity=".8"/>
    <circle cx="46" cy="26" r="5.5" fill="#eab308" opacity=".8"/>
    <circle cx="64" cy="26" r="5.5" fill="#22c55e" opacity=".8"/>
    <text x="86" y="30" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">stata-mcp.gateway</text>
    <rect x="332" y="15" width="122" height="22" rx="11" fill="#0c1e33" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".7"/>
    <circle cx="345" cy="26" r="3.5" fill="#38bdf8"/>
    <text x="354" y="30" fill="#bae6fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">MCP STDIO / HTTP</text>
    <line x1="16" y1="48" x2="456" y2="48" stroke="#1e293b" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="78" fill="#38bdf8" font-weight="700">TRANSPORT</text>
      <text x="118" y="78" fill="#cbd5e1">127.0.0.1:4001 · proxy-immune</text>
      <text x="24" y="104" fill="#818cf8" font-weight="700">RUNTIME</text>
      <text x="118" y="104" fill="#cbd5e1">async jobs · 6h timeout · journal</text>
      <text x="24" y="130" fill="#34d399" font-weight="700">ANALYSIS</text>
      <text x="118" y="130" fill="#cbd5e1">sthlp help · r(NNN) line · linter</text>
      <text x="24" y="156" fill="#f59e0b" font-weight="700">DESKTOP</text>
      <text x="118" y="156" fill="#cbd5e1">Win x64 · macOS arm64/x64 · 6 tabs</text>
    </g>

    <g transform="translate(20 180)">
      <rect x="0" y="0" width="136" height="74" rx="12" fill="#111c30" stroke="#1e2e4a" stroke-width="1"/>
      <text x="68" y="36" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">17</text>
      <text x="68" y="58" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">MCP 工具</text>
      <rect x="148" y="0" width="136" height="74" rx="12" fill="#0b241d" stroke="#134e3e" stroke-width="1"/>
      <text x="216" y="36" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">11</text>
      <text x="216" y="58" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">向量化方案</text>
      <rect x="296" y="0" width="136" height="74" rx="12" fill="#1f180b" stroke="#4d3510" stroke-width="1"/>
      <text x="364" y="36" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">6h</text>
      <text x="364" y="58" text-anchor="middle" fill="#fde68a" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12">默认任务超时</text>
    </g>

    <g transform="translate(24 292)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">
      <text fill="#64748b" font-weight="500">适配：</text>
      <text x="42" fill="#cbd5e1" font-weight="600">Stata 17–19 / StataNow · Win / macOS / Linux · Python 3.9+</text>
    </g>
  </g>
</svg>
